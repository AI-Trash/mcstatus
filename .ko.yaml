# Configuration for ko (https://ko.build/)
defaultBaseImage: alpine:latest

defaultPlatforms:
  - linux/amd64
  - linux/arm64

builds:
  - id: mcstatus
    dir: .
    main: ./cmd/server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -extldflags "-static"
      - -X mcstatus/internal/version.Version={{.Git.FullCommit}}
